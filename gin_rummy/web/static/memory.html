<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Memory - Gin Rummy</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/cards.css">
    <link rel="stylesheet" href="/static/board.css">
    <link rel="stylesheet" href="/static/assist.css">
    <link rel="stylesheet" href="/static/modals.css">
    <link rel="stylesheet" href="/static/replay.css">
    <link rel="stylesheet" href="/static/memory.css">
</head>
<body>
    <div class="memory-container">
        <header class="memory-header">
            <h1>Card Memory</h1>
            <a href="/" class="back-to-game">Back to Game</a>
        </header>

        <div class="memory-status">
            <div class="status-item">
                <span class="status-label">Round:</span>
                <span class="status-value" id="round-display">1</span>
            </div>
            <div class="status-item">
                <span class="status-label">Cards:</span>
                <span class="status-value" id="cards-display">3</span>
            </div>
            <div class="status-item">
                <span class="status-label">Time:</span>
                <span class="status-value" id="timer-display">3.0s</span>
            </div>
            <div class="status-item">
                <span class="status-label">Selected:</span>
                <span class="status-value" id="selected-count">0</span> / <span class="status-value" id="target-count">3</span>
            </div>
        </div>

        <div class="reveal-area" id="reveal-area">
            <span class="reveal-message">Press Start to begin</span>
        </div>

        <div id="results-area"></div>

        <div class="memory-controls" id="controls">
            <button class="memory-btn btn-start" id="start-btn">Start</button>
            <button class="memory-btn btn-submit" id="submit-btn" style="display:none" disabled>Submit</button>
            <button class="memory-btn btn-next" id="next-btn" style="display:none">Next Round</button>
            <button class="memory-btn btn-restart" id="restart-btn" style="display:none">Restart</button>
        </div>

        <div id="grid-legend" class="grid-legend" style="display:none">
            <div class="legend-item"><div class="legend-swatch selected-swatch"></div> Selected</div>
        </div>

        <div class="selection-grid" id="selection-grid"></div>

        <div class="high-score" id="high-score"></div>
    </div>

    <script type="module" src="/static/memory.js"></script>
</body>
</html>
