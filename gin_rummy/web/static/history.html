<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand History - Gin Rummy</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/cards.css">
    <link rel="stylesheet" href="/static/board.css">
    <link rel="stylesheet" href="/static/assist.css">
    <link rel="stylesheet" href="/static/modals.css">
    <link rel="stylesheet" href="/static/replay.css">
    <link rel="stylesheet" href="/static/history.css">
</head>
<body>
    <div class="history-container">
        <header class="history-header">
            <h1>Hand History</h1>
            <a href="/" class="back-to-game">Back to Game</a>
        </header>

        <div class="history-filters">
            <div class="filter-group">
                <label for="player-filter">Player</label>
                <select id="player-filter">
                    <option value="">All Players</option>
                </select>
            </div>
            <button id="apply-filters" class="filter-btn">Apply</button>
        </div>

        <div id="games-container" class="games-list">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Loading game history...</p>
            </div>
        </div>

        <div id="pagination" class="pagination" style="display: none;">
            <button id="prev-page" disabled>Previous</button>
            <span id="page-info">Page 1</span>
            <button id="next-page">Next</button>
        </div>

        <div id="replay-modal" class="replay-modal hidden">
            <div class="replay-modal-content">
                <div id="history-replay-container"></div>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Delete Game</h3>
            <p id="delete-modal-text">Are you sure you want to delete this game? This cannot be undone.</p>
            <div class="modal-buttons">
                <button id="delete-cancel" class="modal-btn cancel">Cancel</button>
                <button id="delete-confirm" class="modal-btn confirm-delete">Delete</button>
            </div>
        </div>
    </div>

    <script type="module" src="/static/history.js"></script>
</body>
</html>
