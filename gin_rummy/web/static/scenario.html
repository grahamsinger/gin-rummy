<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario Quiz - Gin Rummy</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/cards.css">
    <link rel="stylesheet" href="/static/board.css">
    <link rel="stylesheet" href="/static/assist.css">
    <link rel="stylesheet" href="/static/modals.css">
    <link rel="stylesheet" href="/static/replay.css">
    <link rel="stylesheet" href="/static/scenario.css">
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1>🃏 Scenario Quiz <span id="scenarioNum" class="scenario-num"></span></h1>
            <div class="header-buttons">
                <button id="newScenarioBtn" class="quiz-btn primary">New Scenario</button>
                <a href="/" class="quiz-btn">Back to Game</a>
            </div>
        </div>

        <div class="position-panel">
            <h2>What you know</h2>
            <div class="position-stats" id="positionStats"></div>
            <div class="position-rows" id="positionInfo"></div>
        </div>

        <div class="decision-panel" id="decisionPanel">
            <h2 id="decisionTitle">Loading…</h2>
            <div class="decision-prompt" id="decisionPrompt"></div>
            <div class="table-piles" id="tablePiles"></div>
            <div class="decision-buttons" id="decisionButtons"></div>
            <div class="hand-area">
                <div class="hand-label" id="handLabel">Your hand</div>
                <div id="handDisplay"></div>
            </div>
        </div>

        <div class="reveal-panel" id="revealPanel" style="display:none;">
            <h2>What the AIs chose</h2>
            <div id="revealContent"></div>
        </div>

        <div class="deep-panel" id="deepPanel" style="display:none;">
            <h2>Deep analysis</h2>
            <p class="deep-intro">Plays every option to the end of the hand, over thousands of ways the
                hidden cards could lie, using only what you could know. Takes a minute or two; the result is saved.</p>
            <div id="deepContent"></div>
        </div>

        <div class="scoreboard-panel" id="scoreboardPanel">
            <h2>Agreement Scoreboard <span class="judging-chip" id="judgingChip"></span></h2>
            <table class="scoreboard-table" id="scoreboard"></table>
            <div class="status-line" id="statusLine"></div>
        </div>
    </div>

    <script type="module" src="/static/scenario.js"></script>
</body>
</html>
