<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario Quiz - Gin Rummy</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .quiz-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }

        .quiz-header h1 {
            margin: 0;
            color: #fff;
            font-size: 1.5rem;
        }

        .quiz-header .header-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .quiz-btn {
            background: #424242;
            color: #fff;
            border: 1px solid #555;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .quiz-btn:hover:not(:disabled) { background: #555; }
        .quiz-btn:disabled { opacity: 0.4; cursor: default; }
        .quiz-btn.primary { background: #1b5e20; border-color: #2e7d32; }
        .quiz-btn.primary:hover:not(:disabled) { background: #2e7d32; }

        .position-panel, .decision-panel, .reveal-panel, .scoreboard-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
        }

        .position-info {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 0.75rem;
            color: #ccc;
            font-size: 0.95rem;
        }

        .position-info .label { color: #888; margin-right: 0.35rem; }

        .hand-area { margin-top: 0.5rem; }
        .hand-label { color: #888; font-size: 0.85rem; margin-bottom: 0.4rem; }

        .quiz-card {
            display: inline-block;
            background: #fff;
            border-radius: 4px;
            padding: 0.35rem 0.5rem;
            margin: 0.15rem;
            font-weight: bold;
            font-size: 1.05rem;
            min-width: 2.1rem;
            text-align: center;
            border: 2px solid transparent;
        }

        .quiz-card.red { color: #c62828; }
        .quiz-card.black { color: #212121; }

        .quiz-card.selectable { cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
        .quiz-card.selectable:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 10px rgba(255, 235, 59, 0.5);
        }

        .quiz-card.blocked {
            opacity: 0.45;
            cursor: not-allowed;
            border-color: #c62828;
        }

        .quiz-card.drawn { border-color: #fdd835; box-shadow: 0 0 8px rgba(253, 216, 53, 0.6); }
        .quiz-card.small { font-size: 0.85rem; padding: 0.2rem 0.35rem; min-width: 1.7rem; }

        .quiz-meld {
            display: inline-block;
            border-radius: 6px;
            padding: 0.15rem 0.3rem;
            margin: 0.1rem 0.25rem 0.1rem 0;
        }

        .quiz-meld.run { background: rgba(33, 150, 243, 0.25); }
        .quiz-meld.set { background: rgba(156, 39, 176, 0.25); }

        .decision-panel h2, .reveal-panel h2, .scoreboard-panel h2 {
            margin: 0 0 0.75rem;
            color: #fff;
            font-size: 1.1rem;
        }

        .decision-buttons { display: flex; gap: 0.75rem; flex-wrap: wrap; }

        .decision-prompt { color: #ccc; margin-bottom: 0.75rem; }

        .thinking { color: #fdd835; font-style: italic; }

        .reveal-section { margin-bottom: 1rem; }
        .reveal-section h3 {
            color: #aaa;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0 0 0.5rem;
        }

        .reveal-row {
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
            padding: 0.4rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.25rem;
            font-size: 0.92rem;
        }

        .reveal-row.agrees { background: rgba(76, 175, 80, 0.12); }
        .reveal-row.disagrees { background: rgba(244, 67, 54, 0.10); }

        .reveal-marker { font-weight: bold; width: 1.2rem; text-align: center; }
        .reveal-row.agrees .reveal-marker { color: #66bb6a; }
        .reveal-row.disagrees .reveal-marker { color: #ef5350; }

        .reveal-name { color: #fff; font-weight: 600; min-width: 9.5rem; }
        .reveal-text { color: #bbb; flex: 1; }

        .mc-evs { margin: 0.2rem 0 0.4rem 2.4rem; color: #90caf9; font-size: 0.85rem; }

        .scoreboard-table { width: 100%; border-collapse: collapse; color: #ccc; font-size: 0.92rem; }
        .scoreboard-table th, .scoreboard-table td {
            text-align: left;
            padding: 0.35rem 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .scoreboard-table th { color: #888; font-weight: 500; }
        .scoreboard-table td.num { text-align: right; }

        .status-line { color: #888; font-size: 0.85rem; margin-top: 0.4rem; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1>🃏 Scenario Quiz <span id="scenarioNum" style="color:#888; font-size:1rem;"></span></h1>
            <div class="header-buttons">
                <button id="newScenarioBtn" class="quiz-btn primary">New Scenario</button>
                <a href="/" class="quiz-btn">Back to Game</a>
            </div>
        </div>

        <div class="position-panel">
            <div class="position-info" id="positionInfo"></div>
            <div class="hand-area">
                <div class="hand-label" id="handLabel">Your hand</div>
                <div id="handDisplay"></div>
            </div>
        </div>

        <div class="decision-panel" id="decisionPanel">
            <h2 id="decisionTitle">Loading…</h2>
            <div class="decision-prompt" id="decisionPrompt"></div>
            <div class="decision-buttons" id="decisionButtons"></div>
        </div>

        <div class="reveal-panel" id="revealPanel" style="display:none;">
            <h2>What the AIs chose</h2>
            <div id="revealContent"></div>
        </div>

        <div class="scoreboard-panel">
            <h2>Agreement Scoreboard</h2>
            <table class="scoreboard-table" id="scoreboard"></table>
            <div class="status-line" id="statusLine"></div>
        </div>
    </div>

    <script src="/static/card-utils.js"></script>
    <script src="/static/scenario.js"></script>
</body>
</html>
