[project]
name = "gin-rummy"
version = "0.1.0"
description = "A Gin Rummy card game"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
learning = ["torch>=2.0", "numpy>=1.24", "tensorboard>=2.14"]
web = ["fastapi>=0.100", "uvicorn>=0.20"]

[project.scripts]
gin-rummy = "gin_rummy.cli:main"
gin-simulate = "gin_rummy.simulator:main"
gin-train = "gin_rummy.learning.trainer:main"
gin-experiment = "gin_rummy.learning.experiment:main"
gin-scenario = "gin_rummy.scenario_quiz:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "learning: tests that need the optional torch dependency",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F",     # Pyflakes (unused imports, unused variables, redefined-unused, etc.)
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# pytest.importorskip must run before the torch-dependent imports
"tests/test_learning.py" = ["E402"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov", "httpx", "ty", "ruff>=0.8"]
