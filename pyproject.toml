[project]
name = "gin-rummy"
version = "0.1.0"
description = "A Gin Rummy card game"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
learning = ["torch>=2.0", "numpy>=1.24", "tensorboard>=2.14"]
web = ["fastapi>=0.100", "uvicorn>=0.20"]

[project.scripts]
gin-rummy = "gin_rummy.cli:main"
gin-simulate = "gin_rummy.simulator:main"
gin-server = "gin_rummy.network.server:main"
gin-client = "gin_rummy.network.client:main"
gin-train = "gin_rummy.learning.trainer:main"
gin-experiment = "gin_rummy.learning.experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F",     # Pyflakes (unused imports, unused variables, redefined-unused, etc.)
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
]

[dependency-groups]
dev = ["pytest>=8.0", "ty", "ruff>=0.8"]
